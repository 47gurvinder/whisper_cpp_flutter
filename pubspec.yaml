# Maintained by Gurwinder Singh — https://gurwinderdevx.com/
name: whisper_cpp_flutter_plus
description: Offline whisper.cpp bindings for transcription, translation, streaming, and voice activity detection in Flutter.
version: 0.4.1
homepage: https://gurwinderdevx.com/
repository: https://github.com/47gurvinder/whisper_cpp_flutter
funding:
  - https://buymeacoffee.com/gurwinderdevx
topics:
  - whisper
  - speech-to-text
  - transcription
  - offline
  - gdx

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  http: ^1.2.2
  path_provider: ^2.1.5
  crypto: ^3.0.6

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.skynodigital.whisper_cpp_flutter
        pluginClass: WhisperCppFlutterPlugin
      ios:
        pluginClass: WhisperCppFlutterPlugin
